# subpacks are arranged in left to right order
# right-most subpack is enabled by default
[[subpack]]
define = "POTATO_CLOUDS"
materials = ["Clouds"]
description = '''
Potato - Vanilla clouds, no ground reflection, no water reflection, no galaxy stars, no godrays
'''

[[subpack]]
define = "NL_CLOUD_TIER_LOW"
materials = ["Clouds"]
description = '''
Low - No galaxy stars, no ground reflection, weaker godrays, static clouds
'''

[[subpack]]
define = "NL_CLOUD_TIER_MEDIUM"
materials = ["Clouds"]
description = '''
Medium - Static clouds, no galaxy stars
'''

[[subpack]]
define = "NL_CLOUD_TIER_HIGH"
materials = ["Clouds"]
description = '''
High - every feature
'''
